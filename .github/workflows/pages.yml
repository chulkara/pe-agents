name: Deploy Kalling to GitHub Pages
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test business rules and database permissions
        run: npm test
      - name: Build the static demo
        run: npm run build
      - name: Install browser for fictional workflow checks
        run: npx playwright install --with-deps chromium
      - name: Start the fictional test server
        id: fixture_server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/kalling-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kalling-vite.log
          exit 1
      - name: Check existing deal flow
        run: npm run e2e
      - name: Check existing seller flow
        if: ${{ !cancelled() && steps.fixture_server.outcome == 'success' }}
        run: npm run e2e:seller
      - name: Check execution, permissions and three screen widths
        if: ${{ !cancelled() && steps.fixture_server.outcome == 'success' }}
        run: npm run e2e:execution
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
